<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You — Tell Kela Anonymously</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #261b32;
        }

        .page {
            position: relative;
            width: min(100vw, 420px);
            line-height: 0;
        }

        .page img {
            display: block;
            width: 100%;
            height: auto;
        }

        .back-button {
            position: absolute;
            left: 18%;
            top: 72%;
            width: 34%;
            height: 7%;
            border: none;
            background: transparent;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <main class="page">
        <img src="assets/last.png" alt="Thank you for your message">

        <button
            class="back-button"
            aria-label="Back to home"
            onclick="window.location.href='index.html'">
        </button>
    </main>

</body>
</html>
