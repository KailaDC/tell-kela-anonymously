<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <title>Tell Kela Anonymously</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #000;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
        }

        .page {
            position: relative;
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
            line-height: 0;
        }

        .page img {
            display: block;
            width: 100%;
            height: auto;
        }

        textarea {
            position: absolute;
            left: 20%;
            top: 24%;
            width: 64%;
            height: 52%;

            margin: 0;
            padding: 12px;
            border: none;
            border-radius: 0;
            outline: none;
            resize: none;

            overflow-y: auto;
            overflow-wrap: anywhere;

            background: transparent;
            color: #333;

            font-family: Arial, sans-serif;
            font-size: clamp(12px, 3.3vw, 16px);
            line-height: 1.5;

            -webkit-appearance: none;
            appearance: none;
        }

        textarea::placeholder {
            color: #777;
            opacity: 1;
        }

        .word-count {
            position: absolute;
            right: 20%;
            top: 75%;

            font-family: Arial, sans-serif;
            font-size: clamp(10px, 2.6vw, 12px);
            line-height: 1.2;
            color: #555;

            pointer-events: none;
            white-space: nowrap;
        }

        .send-button {
            position: absolute;
            left: 32%;
            top: 78%;
            width: 36%;
            height: 8%;

            margin: 0;
            padding: 0;
            border: none;
            border-radius: 0;
            background: transparent;

            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .send-button:focus-visible {
            outline: 2px dashed #555;
            outline-offset: 3px;
        }

        .send-button:disabled {
            cursor: wait;
        }

        @media (min-width: 700px) {
            .page {
                width: min(100%, 900px);
            }

            textarea {
                font-size: 16px;
            }

            .word-count {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>
    <main class="page">
        <img
            src="assets/isi.png"
            alt="Form Tell Kela Anonymously"
            fetchpriority="high"
        >

        <textarea
            id="message"
            placeholder="Ketik pesanmu..."
            aria-label="Pesan anonim"
            maxlength="5000"
            required
        ></textarea>

        <div class="word-count" aria-live="polite">
            <span id="count">0</span>/500 kata
        </div>

        <button
            type="button"
            id="sendButton"
            class="send-button"
            aria-label="Kirim pesan"
        ></button>
    </main>

    <script type="module">
        import {
            collection,
            addDoc,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

        import { db } from "./js/firebase-config.js";

        const message = document.getElementById("message");
        const count = document.getElementById("count");
        const sendButton = document.getElementById("sendButton");

        function getWordCount(text) {
            const trimmed = text.trim();
            return trimmed ? trimmed.split(/\s+/u).length : 0;
        }

        message.addEventListener("input", () => {
            const words = getWordCount(message.value);

            count.textContent = words;
            count.style.color = words > 500 ? "#c62828" : "#555";
        });

        sendButton.addEventListener("click", async () => {
            const text = message.value.trim();
            const words = getWordCount(text);

            if (!text) {
                alert("Pesannya belum diisi, ya!");
                message.focus();
                return;
            }

            if (words > 500) {
                alert("Maksimal 500 kata, ya!");
                message.focus();
                return;
            }

            sendButton.disabled = true;

            try {
                await addDoc(collection(db, "confessions"), {
                    message: text,
                    createdAt: serverTimestamp()
                });

                window.location.href = "success.html";
            } catch (error) {
                console.error("Gagal menyimpan pesan:", error);

                alert(
                    "Pesan belum berhasil dikirim. " +
                    "Periksa koneksi internet dan pengaturan Firebase, lalu coba lagi."
                );

                sendButton.disabled = false;
            }
        });
    </script>
</body>
</html>
